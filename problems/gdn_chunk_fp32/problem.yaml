name: Gated DeltaNet chunked prefill (Qwen3.8-27B, fp32)
description: >-
  One Gated DeltaNet layer's chunked forward pass at Qwen3.8-27B dims. This is the
  linear-attention block used in 48 of that model's 64 layers. ref.py is the spec: it is the Qwen
  authors' own reference, vendored so it cannot drift.

  Layout is row-major, token-major: q,k (kT,kHk,kD); v,o (kT,kHv,kD); g,beta (kT,kHv);
  state (kHv,kD,kD). GQA is real — 16 QK heads feed 48 V heads by repeat_interleave, so
  V head j reads QK head j/3 (floor division; j % 16 computes a different problem). The
  kernel L2-normalises q and k itself (eps 1e-6) and applies scale = 1/sqrt(kD).

  The chunk loop is sequential over kT/64 = 128 chunks carrying the state, and parallel
  over only 48 heads — so half of the 82 SMs idle, and fixing that is most of the work.
  output/reference_time.json is pre-seeded with 6772 us (fla's chunked Triton kernel,
  measured on this card). The compute floor is 1115 us, so the ceiling is about 6x;
  a speedup meaningfully past that is a bug, not a result.

gpu:
  index: 0
global_size_type: opencl
grid:
  x: kHv * kD
  y: '1'
  z: '1'
reference:
  type: python
  function: gdn_chunk_reference
  file: ref.py
validation:
  # 1e-4 absolute, set by measurement not habit: |o|max is 0.167 and mean 0.023, this
  # reference agrees with transformers to 1.9e-8 and with fla to 1.0e-4, and fp32
  # reassociation noise is ~1e-6. So 1e-4 sits ~100x above reassociation noise and
  # ~1000x below the smallest cheat signal measured (0.120, for dropping carried state).
  tolerance: 0.0001
tuning:
  duration_s: 100
rules:
  text:
    - "Accumulate in fp32 throughout. The recurrent state, the triangular solve, and every
       matmul are fp32. This problem measures a CUDA-core fp32 kernel; reduced precision
       is a different problem with a different baseline."
    - "Carry the recurrent state through every chunk. Truncating gate-decayed history is a
       real technique (FlashQLA's context parallelism) but it changes the problem and is
       out of scope here."
    - "Write the final `state` buffer correctly even though it is not validated. It is the
       next layer's initial state, and leaving it unwritten solves an easier problem."
  forbid:
    - pattern: "wmma::|mma\\.sync"
      reason: "tensor cores change the numerics and the baseline this problem measures; fp32 CUDA cores only"
    - pattern: "\\b__half\\b|__nv_bfloat16|\\bnv_bfloat16\\b"
      reason: "fp16/bf16 storage is not permitted — the declared scope is fp32 end to end"
    - pattern: "cublas|cutlass|cudnn"
      reason: "the point is to write the kernel, not to call a library that contains one"
