[pytest]
testpaths = tests
# The step loop is async; auto mode avoids every async test needing a marker and
# avoids the strict-mode failure where an unmarked coroutine test silently passes
# without running its assertions.
asyncio_mode = auto
markers =
    integration: links the real driver with g++ and runs real NVRTC (seconds, needs libktt.so)
filterwarnings =
    ignore::DeprecationWarning
